<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Login • TJSP Duo</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#17191f;background:#fafafa;color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#fafafa}
.card{width:min(430px,100%);background:white;border:1px solid #e3e6eb;border-radius:22px;padding:clamp(23px,5vw,36px);box-shadow:0 14px 40px #1118270b}
.brand{font-size:26px;font-weight:900;letter-spacing:-.04em}.brand b{color:#b50913}.subtitle{margin:5px 0 25px;font-size:12px;color:#647083}.mark{display:inline-grid;place-items:center;background:#b50913;color:#fff;width:42px;height:42px;border-radius:12px;margin-right:8px}
h1{font-size:24px;margin:0 0 10px}.intro{color:#657081;line-height:1.55;font-size:14px;margin:0 0 20px}label{display:block;font-weight:750;font-size:13px;margin:15px 0 7px}
input{width:100%;border:1px solid #d4d7df;background:#fff;color:#17191f;padding:13px;border-radius:11px;font:inherit;font-size:16px}input:focus-visible,button:focus-visible{outline:3px solid #eb9aa1;outline-offset:2px}
button{cursor:pointer;font:inherit;font-weight:800;border-radius:11px;padding:12px;border:1px solid #e3e6eb;background:#fff;color:#b50913}button:disabled{opacity:.5}.primary{display:block;width:100%;margin-top:20px;background:#b50913;color:white;border-color:#b50913}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:10px}.actions button{border:none;font-size:13px;background:transparent}
#loginMessage{margin:16px 0 0;padding:12px;border:1px solid #efc6cb;background:#fff1f2;color:#90101b;font-size:13px;border-radius:11px;line-height:1.6}#loginMessage[data-kind=note]{background:#f8f9fa;border-color:#e3e6eb;color:#626b79}
footer{margin-top:17px;padding-top:16px;border-top:1px solid #e3e6eb;color:#788292;font-size:12px;line-height:1.55}
</style></head><body><main class="card"><div class="brand"><span class="mark">⚖</span>TJSP <b>Duo</b></div><div class="subtitle">Sua jornada de aprovação</div><h1>Entre para continuar</h1><p class="intro">Suas aulas, calendário, simulados e perfil só aparecem após o login.</p><form id="loginForm"><label for="email">E-mail</label><input id="email" type="email" placeholder="seu@email.com" autocomplete="email" inputmode="email" required maxlength="150"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" minlength="1" required><button class="primary" type="submit" id="loginSubmit" disabled>Entrar</button></form><div class="actions"><button id="resetPassword" disabled type="button">Esqueci a senha</button><button id="loginToggle" disabled type="button">Criar conta</button></div><p id="loginMessage" role="status" aria-live="polite" data-kind="note">Conectando ao Firebase…</p><footer>Acesse com a mesma conta em qualquer dispositivo. Projeto independente, não afiliado ao TJSP.</footer></main><script type="module" src="./login.js?v=9"></script></body></html>
