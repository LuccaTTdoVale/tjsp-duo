<text x="425" y="171" fill="#b50913" font-size="19" font-weight="800" font-family="Arial,sans-serif">APLICAÇÃO</text>
<text x="425" y="215" fill="#17191f" font-size="19" font-family="Arial,sans-serif">Um candidato aprovado para cargo</text>
