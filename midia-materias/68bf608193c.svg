<text x="48" y="215" fill="#17191f" font-size="19" font-family="Arial,sans-serif">Tipo básico e qualidade do agente</text>
<rect x="402" y="132" width="356" height="365" rx="17" fill="#f5f5f6" stroke="#d8dbe0" stroke-width="2"/>
