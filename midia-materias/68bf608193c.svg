<text x="425" y="171" fill="#b50913" font-size="19" font-weight="800" font-family="Arial,sans-serif">APLICAÇÃO</text>
<text x="425" y="215" fill="#17191f" font-size="19" font-family="Arial,sans-serif">Um funcionário público, com posse</text>
<text x="425" y="245" fill="#17191f" font-size="19" font-family="Arial,sans-serif">de dinheiro pelo cargo, desvia</text>
<text x="425" y="275" fill="#17191f" font-size="19" font-family="Arial,sans-serif">parte do valor para terceiro.</text>
