<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="493" viewBox="0 0 1140 493" role="img" aria-label="Mapa visual da aula Divisibilidade, MMC e MDC">
<rect width="1140" height="100%" fill="#fff"/>
<rect width="1140" height="10" fill="#b50913"/>
<text x="28" y="43" fill="#b50913" font-size="19" font-weight="800" font-family="Arial, sans-serif">TJSP DUO · ESQUEMA DIDÁTICO</text>
<text x="28" y="88" fill="#17191f" font-size="31" font-weight="800" font-family="Arial,sans-serif">Divisibilidade, MMC e MDC</text>
<rect x="25" y="132" width="356" height="335" rx="17" fill="#fafafa" stroke="#d8dbe0" stroke-width="2"/>
<rect x="25" y="132" width="8" height="335" rx="4" fill="#b50913"/>
<text x="48" y="171" fill="#b50913" font-size="19" font-weight="800" font-family="Arial,sans-serif">CONCEITO</text>
<text x="48" y="215" fill="#17191f" font-size="19" font-family="Arial,sans-serif">Diferença operacional entre MMC e</text>
<text x="48" y="245" fill="#17191f" font-size="19" font-family="Arial,sans-serif">MDC</text>
<rect x="402" y="132" width="356" height="335" rx="17" fill="#f5f5f6" stroke="#d8dbe0" stroke-width="2"/>
<rect x="402" y="132" width="8" height="335" rx="4" fill="#4c515a"/>
<text x="425" y="171" fill="#b50913" font-size="19" font-weight="800" font-family="Arial,sans-serif">APLICAÇÃO</text>
<text x="425" y="215" fill="#17191f" font-size="19" font-family="Arial,sans-serif">Dois alarmes disparam a cada 8 e 12</text>
<text x="425" y="245" fill="#17191f" font-size="19" font-family="Arial,sans-serif">minutos, começando juntos.</text>
<rect x="779" y="132" width="356" height="335" rx="17" fill="#fafafa" stroke="#d8dbe0" stroke-width="2"/>
<rect x="779" y="132" width="8" height="335" rx="4" fill="#b50913"/>
<text x="802" y="171" fill="#b50913" font-size="19" font-weight="800" font-family="Arial,sans-serif">ALERTA DE PROVA</text>
<text x="802" y="215" fill="#17191f" font-size="19" font-family="Arial,sans-serif">Empregar MDC em problemas de</text>
<text x="802" y="245" fill="#17191f" font-size="19" font-family="Arial,sans-serif">simultaneidade ou MMC para formar</text>
<text x="802" y="275" fill="#17191f" font-size="19" font-family="Arial,sans-serif">grupos iguais máximos.</text>
</svg>