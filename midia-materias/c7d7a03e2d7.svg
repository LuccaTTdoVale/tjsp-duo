<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="523" viewBox="0 0 1140 523" role="img" aria-label="Mapa visual da aula Crimes contra a Administração Pública">
<rect width="1140" height="100%" fill="#fff"/>
<rect width="1140" height="10" fill="#b50913"/>
<text x="28" y="43" fill="#b50913" font-size="19" font-weight="800" font-family="Arial, sans-serif">TJSP DUO · ESQUEMA DIDÁTICO</text>
<text x="28" y="88" fill="#17191f" font-size="31" font-weight="800" font-family="Arial,sans-serif">Crimes contra a Administração Pública</text>
<rect x="25" y="132" width="356" height="365" rx="17" fill="#fafafa" stroke="#d8dbe0" stroke-width="2"/>
<rect x="25" y="132" width="8" height="365" rx="4" fill="#b50913"/>
<text x="48" y="171" fill="#b50913" font-size="19" font-weight="800" font-family="Arial,sans-serif">CONCEITO</text>
<text x="48" y="215" fill="#17191f" font-size="19" font-family="Arial,sans-serif">Estudo por tipos penais</text>
<rect x="402" y="132" width="356" height="365" rx="17" fill="#f5f5f6" stroke="#d8dbe0" stroke-width="2"/>
<rect x="402" y="132" width="8" height="365" rx="4" fill="#4c515a"/>
<text x="425" y="171" fill="#b50913" font-size="19" font-weight="800" font-family="Arial,sans-serif">APLICAÇÃO</text>
<text x="425" y="215" fill="#17191f" font-size="19" font-family="Arial,sans-serif">Um servidor recebe pagamento em</text>
<text x="425" y="245" fill="#17191f" font-size="19" font-family="Arial,sans-serif">razão do cargo e o destina ao seu</text>
<text x="425" y="275" fill="#17191f" font-size="19" font-family="Arial,sans-serif">patrimônio, contrariando a</text>
<text x="425" y="305" fill="#17191f" font-size="19" font-family="Arial,sans-serif">finalidade oficial.</text>
<rect x="779" y="132" width="356" height="365" rx="17" fill="#fafafa" stroke="#d8dbe0" stroke-width="2"/>
<rect x="779" y="132" width="8" height="365" rx="4" fill="#b50913"/>
<text x="802" y="171" fill="#b50913" font-size="19" font-weight="800" font-family="Arial,sans-serif">ALERTA DE PROVA</text>
<text x="802" y="215" fill="#17191f" font-size="19" font-family="Arial,sans-serif">Chamar qualquer irregularidade</text>
<text x="802" y="245" fill="#17191f" font-size="19" font-family="Arial,sans-serif">administrativa de peculato, mesmo</text>
<text x="802" y="275" fill="#17191f" font-size="19" font-family="Arial,sans-serif">sem requisitos do tipo penal.</text>
</svg>