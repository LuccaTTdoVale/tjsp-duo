<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" role="img" aria-labelledby="tt desc"><title id="tt">CRASE: DOIS ELEMENTOS</title><desc id="desc">O verbo exige preposição e o nome admite artigo.</desc><rect width="980" height="340" rx="17" fill="#ffffff"/><rect x="0" y="0" width="980" height="6" fill="#b50913"/><text x="26" y="49" font-size="26" font-family="Arial,sans-serif" font-weight="800" fill="#b50913">CRASE: DOIS ELEMENTOS</text><text x="27" y="82" font-size="16" fill="#444851" font-family="Arial,sans-serif">O verbo exige preposição e o nome admite artigo.</text><rect x="24" y="104" width="292" height="105" rx="14" fill="#fafafa" stroke="#dedfe4"/><text x="38" y="141" font-size="17" font-family="Arial,sans-serif" font-weight="700" fill="#17191f">Regência: referir-se A</text><text x="38" y="191" font-size="14" font-family="Arial,sans-serif" fill="#454b54">a + a = à</text><rect x="344" y="104" width="292" height="105" rx="14" fill="#fff2f3" stroke="#dedfe4"/><text x="358" y="141" font-size="17" font-family="Arial,sans-serif" font-weight="700" fill="#17191f">Artigo: A norma</text><text x="358" y="191" font-size="14" font-family="Arial,sans-serif" fill="#454b54">Sem um dos dois, não há crase</text><rect x="664" y="104" width="292" height="105" rx="14" fill="#f3f4f5" stroke="#dedfe4"/><text x="678" y="141" font-size="17" font-family="Arial,sans-serif" font-weight="700" fill="#17191f">Resultado: À norma</text><text x="678" y="191" font-size="14" font-family="Arial,sans-serif" fill="#454b54">Resultado da análise</text><path d="M316 155h23m-7 -7 7 7 -7 7 M636 155h23m-7 -7 7 7 -7 7" fill="none" stroke="#b50913" stroke-width="3" stroke-linecap="round"/><rect x="24" y="234" width="932" height="80" rx="12" fill="#f7f7f8" stroke="#e1e2e5"/><text x="42" y="262" font-size="16" font-weight="700" fill="#b50913" font-family="Arial,sans-serif">COMO ANALISAR NA PROVA</text><text x="42" y="289" font-size="17" fill="#22262c" font-family="Arial,sans-serif">O verbo exige preposição e o nome admite artigo.</text></svg>