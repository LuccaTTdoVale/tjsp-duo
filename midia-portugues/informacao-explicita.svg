<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img"><rect width="1100" height="340" fill="#fff"/><rect width="1100" height="7" fill="#b50913"/><text x="38" y="51" font-size="30" font-weight="800" fill="#b50913" font-family="Arial,sans-serif">INFORMAÇÃO EXPLÍCITA E EXCEÇÃO</text><text x="38" y="88" font-size="18" fill="#34383f" font-family="Arial,sans-serif">Os guichês funcionam de segunda a sexta, exceto em feriados.</text><rect x="35" y="115" width="335" height="125" rx="16" fill="#f7f7f8" stroke="#dfe1e5"/><text x="55" y="155" font-size="26" font-weight="800" font-family="Arial,sans-serif" fill="#ad0813">Regra</text><text x="55" y="198" font-size="18" font-family="Arial,sans-serif" fill="#17191f">De segunda a sexta</text><rect x="400" y="115" width="335" height="125" rx="16" fill="#fff2f3" stroke="#dfe1e5"/><text x="420" y="155" font-size="26" font-weight="800" font-family="Arial,sans-serif" fill="#ad0813">Exceção</text><text x="420" y="198" font-size="18" font-family="Arial,sans-serif" fill="#17191f">Exceto em feriados</text><rect x="765" y="115" width="335" height="125" rx="16" fill="#f7f7f8" stroke="#dfe1e5"/><text x="785" y="155" font-size="26" font-weight="800" font-family="Arial,sans-serif" fill="#ad0813">Conclusão</text><text x="785" y="198" font-size="18" font-family="Arial,sans-serif" fill="#17191f">Não ignore a ressalva</text><rect x="35" y="255" width="1060" height="62" rx="12" fill="#f6f6f7"/><text x="54" y="292" font-size="18" font-family="Arial,sans-serif" fill="#17191f">A alternativa que omite a exceção amplia indevidamente a regra.</text></svg>